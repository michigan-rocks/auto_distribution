x-producer-common: &producer-common
  build:
    context: .
    dockerfile: producer/Dockerfile
  image: task-producer:local
  restart: unless-stopped
  depends_on:
    rabbitmq:
      condition: service_healthy
  networks:
    - monitoring

x-producer-environment: &producer-environment
  RABBITMQ_HOST: rabbitmq
  RABBITMQ_PORT: "5672"
  RABBITMQ_USER: user
  RABBITMQ_PASSWORD: user

x-worker-common: &worker-common
  build:
    context: .
    dockerfile: workers/Dockerfile
  image: adaptive-task-worker:local
  restart: unless-stopped
  depends_on:
    rabbitmq:
      condition: service_healthy
  networks:
    - monitoring

x-worker-environment: &worker-environment
  RABBITMQ_HOST: rabbitmq
  RABBITMQ_PORT: "5672"
  RABBITMQ_USER: user
  RABBITMQ_PASSWORD: user
  WORKER_MODE: adaptive
  WORKER_SEND_FULL_RESULT: "true"
  METRICS_PORT: "9100"

services:
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: user
      RABBITMQ_DEFAULT_PASS: user
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - monitoring

  producer:
    <<: *producer-common
    profiles: [adaptive, round-robin]
    container_name: producer
    environment:
      <<: *producer-environment
      PRODUCER_MODE: adaptive

  producer-baseline:
    <<: *producer-common
    profiles: [baseline]
    environment:
      <<: *producer-environment
      PRODUCER_MODE: baseline

  prometheus:
    image: prom/prometheus:v3.8.0
    container_name: prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./pkg/monitoring/prometeus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - monitoring

  grafana:
    image: grafana/grafana:12.2.0
    container_name: grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    volumes:
      - grafana_data:/var/lib/grafana
      - ./pkg/monitoring/graphana/datasourses.yaml:/etc/grafana/provisioning/datasources/datasources.yaml:ro
    networks:
      - monitoring

  dispatcher:
    profiles: [adaptive]
    build:
      context: .
      dockerfile: internal/Dockerfile
    container_name: dispatcher
    restart: unless-stopped
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: user
      RABBITMQ_PASSWORD: user
    networks:
      - monitoring

  round-robin-dispatcher:
    profiles: [round-robin]
    build:
      context: .
      dockerfile: round_robin/Dockerfile
    restart: unless-stopped
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: "5672"
      RABBITMQ_USER: user
      RABBITMQ_PASSWORD: user
    networks:
      - monitoring

  worker1:
    <<: *worker-common
    profiles: [adaptive, round-robin]
    environment:
      <<: *worker-environment
      WORKER_ID: "1"
      SIMULATED_DELAY_MS_AT_400: "0"

  worker2:
    <<: *worker-common
    profiles: [adaptive, round-robin]
    environment:
      <<: *worker-environment
      WORKER_ID: "2"
      SIMULATED_DELAY_MS_AT_400: "250"

  worker3:
    <<: *worker-common
    profiles: [adaptive, round-robin]
    environment:
      <<: *worker-environment
      WORKER_ID: "3"
      SIMULATED_DELAY_MS_AT_400: "600"

  baseline-worker1:
    <<: *worker-common
    profiles: [baseline]
    networks:
      monitoring:
        aliases: [worker1]
    environment:
      <<: *worker-environment
      WORKER_MODE: baseline
      WORKER_ID: "1"
      SIMULATED_DELAY_MS_AT_400: "0"

  baseline-worker2:
    <<: *worker-common
    profiles: [baseline]
    networks:
      monitoring:
        aliases: [worker2]
    environment:
      <<: *worker-environment
      WORKER_MODE: baseline
      WORKER_ID: "2"
      SIMULATED_DELAY_MS_AT_400: "250"

  baseline-worker3:
    <<: *worker-common
    profiles: [baseline]
    networks:
      monitoring:
        aliases: [worker3]
    environment:
      <<: *worker-environment
      WORKER_MODE: baseline
      WORKER_ID: "3"
      SIMULATED_DELAY_MS_AT_400: "600"

networks:
  monitoring:

volumes:
  grafana_data:
  prometheus_data:
  rabbitmq_data:
