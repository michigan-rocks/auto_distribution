x-producer-common: &producer-common
  build:
    context: .
    dockerfile: producer/Dockerfile
  image: task-producer:local
  restart: "no"
  volumes:
    - ${WORKLOAD_DIR:-./workloads}:/workloads:ro
    - ${RESULTS_DIR:-./results}:/results
  depends_on:
    rabbitmq:
      condition: service_healthy
  networks:
    - monitoring

x-producer-environment: &producer-environment
  RABBITMQ_HOST: rabbitmq
  RABBITMQ_PORT: "5672"
  RABBITMQ_USER: user
  RABBITMQ_PASSWORD: user
  EXPERIMENT_ID: "${EXPERIMENT_ID:-}"
  SCHEDULER_MODE: "${SCHEDULER_MODE:-adaptive}"
  PRODUCER_WORKLOAD: "${PRODUCER_WORKLOAD:-/workloads/default.jsonl}"
  PRODUCER_INTERVAL_MS: "${PRODUCER_INTERVAL_MS:-0}"
  BENCHMARK_RESULTS_DIR: /results
  BENCHMARK_TIMEOUT_SECONDS: "${BENCHMARK_TIMEOUT_SECONDS:-3600}"
  ADAPTIVE_DISPATCH_WINDOW: "${ADAPTIVE_DISPATCH_WINDOW:-6}"
  ADAPTIVE_EWMA_ALPHA: "${ADAPTIVE_EWMA_ALPHA:-0.2}"

x-worker-common: &worker-common
  build:
    context: .
    dockerfile: workers/Dockerfile
  image: adaptive-task-worker:local
  restart: unless-stopped
  depends_on:
    rabbitmq:
      condition: service_healthy
  networks:
    - monitoring

x-worker-environment: &worker-environment
  RABBITMQ_HOST: rabbitmq
  RABBITMQ_PORT: "5672"
  RABBITMQ_USER: user
  RABBITMQ_PASSWORD: user
  WORKER_MODE: adaptive
  WORKER_SEND_FULL_RESULT: "${WORKER_SEND_FULL_RESULT:-false}"
  EXPERIMENT_ID: "${EXPERIMENT_ID:-}"
  METRICS_PORT: "9100"

services:
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: user
      RABBITMQ_DEFAULT_PASS: user
      RABBITMQ_MNESIA_BASE: /tmp/rabbitmq/mnesia
    healthcheck:
      test: ["CMD-SHELL", 'wget -q -O /dev/null "http://$${RABBITMQ_DEFAULT_USER}:$${RABBITMQ_DEFAULT_PASS}@127.0.0.1:15672/api/health/checks/protocol-listener/amqp"']
      interval: 3s
      timeout: 10s
      start_period: 10s
      retries: 20
    # Mask the image's built-in VOLUME; only the small Erlang cookie lives here.
    # The actual database stays on disk in the container layer at the path above.
    tmpfs:
      - /var/lib/rabbitmq:size=1m
    networks:
      - monitoring

  producer:
    <<: *producer-common
    profiles: [adaptive, round-robin]
    container_name: producer
    environment:
      <<: *producer-environment
      PRODUCER_MODE: "${SCHEDULER_MODE:-adaptive}"

  producer-baseline:
    <<: *producer-common
    profiles: [baseline]
    environment:
      <<: *producer-environment
      PRODUCER_MODE: baseline
      SCHEDULER_MODE: baseline

  prometheus:
    image: prom/prometheus:v3.8.0
    container_name: prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/tmp/prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./pkg/monitoring/prometeus.yml:/etc/prometheus/prometheus.yml:ro
    # Mask the image's built-in VOLUME; TSDB data uses the container layer.
    tmpfs:
      - /prometheus:size=1m
    networks:
      - monitoring

  grafana:
    image: grafana/grafana:12.2.0
    container_name: grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    volumes:
      - ./pkg/monitoring/graphana/datasourses.yaml:/etc/grafana/provisioning/datasources/datasources.yaml:ro
    networks:
      - monitoring

  dispatcher:
    profiles: [adaptive]
    build:
      context: .
      dockerfile: internal/Dockerfile
    container_name: dispatcher
    restart: unless-stopped
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: user
      RABBITMQ_PASSWORD: user
      EXPERIMENT_ID: "${EXPERIMENT_ID:-}"
      ADAPTIVE_DISPATCH_WINDOW: "${ADAPTIVE_DISPATCH_WINDOW:-6}"
      ADAPTIVE_EWMA_ALPHA: "${ADAPTIVE_EWMA_ALPHA:-0.2}"
    networks:
      - monitoring

  round-robin-dispatcher:
    profiles: [round-robin]
    build:
      context: .
      dockerfile: round_robin/Dockerfile
    restart: unless-stopped
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: "5672"
      RABBITMQ_USER: user
      RABBITMQ_PASSWORD: user
      EXPERIMENT_ID: "${EXPERIMENT_ID:-}"
    networks:
      - monitoring

  worker1:
    <<: *worker-common
    profiles: [adaptive, round-robin]
    cpus: "${WORKER1_CPUS:-1.0}"
    environment:
      <<: *worker-environment
      WORKER_ID: "1"

  worker2:
    <<: *worker-common
    profiles: [adaptive, round-robin]
    cpus: "${WORKER2_CPUS:-0.5}"
    environment:
      <<: *worker-environment
      WORKER_ID: "2"

  worker3:
    <<: *worker-common
    profiles: [adaptive, round-robin]
    cpus: "${WORKER3_CPUS:-0.25}"
    environment:
      <<: *worker-environment
      WORKER_ID: "3"

  baseline-worker1:
    <<: *worker-common
    profiles: [baseline]
    cpus: "${WORKER1_CPUS:-1.0}"
    networks:
      monitoring:
        aliases: [worker1]
    environment:
      <<: *worker-environment
      WORKER_MODE: baseline
      WORKER_ID: "1"

  baseline-worker2:
    <<: *worker-common
    profiles: [baseline]
    cpus: "${WORKER2_CPUS:-0.5}"
    networks:
      monitoring:
        aliases: [worker2]
    environment:
      <<: *worker-environment
      WORKER_MODE: baseline
      WORKER_ID: "2"

  baseline-worker3:
    <<: *worker-common
    profiles: [baseline]
    cpus: "${WORKER3_CPUS:-0.25}"
    networks:
      monitoring:
        aliases: [worker3]
    environment:
      <<: *worker-environment
      WORKER_MODE: baseline
      WORKER_ID: "3"

networks:
  monitoring:
