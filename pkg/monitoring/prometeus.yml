global:
  scrape_interval: 3s

scrape_configs:
  - job_name: "rabbitmq"
    scrape_interval: 1s
    metrics_path: /metrics/per-object
    static_configs:
      - targets: ["rabbitmq:15692"]

  - job_name: "workers"
    scrape_interval: 1s
    static_configs:
      - targets: ["worker1:9100", "worker2:9100", "worker3:9100"]

  - job_name: "benchmark-results"
    scrape_interval: 3s
    static_configs:
      - targets: ["benchmark-exporter:9200"]

